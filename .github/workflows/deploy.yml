name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows manual runs from the Actions tab
  workflow_dispatch:

# Least privilege: read the repo, publish to Pages, verify the deploy
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer push finish rather than cancelling it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build static export
        # Project sites are served from /<repo>/, so the app needs that prefix
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
